name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend deps
        run: |
          cd backend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate
        env:
          DATABASE_URL: file:./test.db
          JWT_SECRET: test-jwt-secret-for-ci
          COOKIE_SECRET: test-cookie-secret-for-ci

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci
        continue-on-error: true

      - name: Backend tests
        run: |
          cd backend
          npm test
        env:
          DATABASE_URL: file:./test.db
          JWT_SECRET: test-jwt-secret-for-ci
          COOKIE_SECRET: test-cookie-secret-for-ci

      - name: Frontend tests
        run: |
          cd frontend
          npm test

      - name: Build backend
        run: |
          cd backend
          npm run build
        env:
          DATABASE_URL: file:./test.db
          JWT_SECRET: test-jwt-secret-for-ci
          COOKIE_SECRET: test-cookie-secret-for-ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Docker build
        run: docker build -t mokuro-library:ci .
