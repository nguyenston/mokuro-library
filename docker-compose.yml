services:
  mokuro:
    container_name: mokuro-library
    # Option 1: Build from the current directory
    build:
      context: .
      args:
        - VITE_COMMIT_HASH=${VITE_COMMIT_HASH:-v0.4.0}
    # restart: unless-stopped
    ports:
      # Maps port 80 on computer to port 3001 inside the container.
      # Change the first number if port 80 is already in use (e.g., "8080:3001").
      - "3001:3001"
    volumes:
      # Persist the SQLite database.
      - ./data:/app/data
      # Persist uploaded manga files.
      - ./data/uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Default to HTTP for LAN/NAS; remove this line if you terminate HTTPS upstream.
      - MOKURO_DISABLE_HTTPS_REDIRECT=true
      # Ensure the DB file is stored in the mounted /app/data volume
      - DATABASE_URL=file:/app/data/library.db
      # Security secrets - REQUIRED for production
      # Generate with: ./scripts/generate-secrets.sh .env.secrets
      # Then load with: docker-compose up -d (will read .env.secrets automatically)
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
    # Load secrets from .env.secrets file (REQUIRED for production)
    # Run ./scripts/generate-secrets.sh .env.secrets to create this file
    env_file:
      - .env.secrets
